[package]
name = "gotranscript"
version = "1.0.0"
description = "GoTranscript desktop client"
authors = ["GoTranscript"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gotranscript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
